[package]
name = "app"
version = "0.1.0"
description = "anyNFS.xyz desktop — native Tauri MVP for nfsu2.xyz, nfsu2mod.xyz and nfscrb.xyz"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1"
image = "0.25"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
scraper = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = ["custom-protocol"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["rt"] }
